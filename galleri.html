    <dialog class="gallery-viewer" aria-label="Bildevisning">
      <button class="gallery-button gallery-close" type="button" data-close autofocus>Lukk ×</button>
      <img class="gallery-full-image" alt="">
      <div class="gallery-controls">
        <button class="gallery-button gallery-arrow" type="button" data-previous aria-label="Forrige bilde">‹</button>
        <span class="gallery-position" aria-live="polite"></span>
        <button class="gallery-button gallery-arrow" type="button" data-next aria-label="Neste bilde">›</button>
        <button class="gallery-button" type="button" data-play>Spill av</button>
      </div>
    </dialog>
  </main>

  <footer>
    Hankattforeningen stiftet 1902 · Pentagonveien 1, 1430 Ås
    <div class="stamp">Skål for Kulturen.</div>
  </footer>

  <script src="js/galleri.js"></script>
</body>
